<!doctype html>
<html lang="en" data-theme="system">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <meta name="theme-color" content="#f6f5f1" />
    <meta name="color-scheme" content="light dark" />
    <style>
      :root {
        --boot-paper: #f6f5f1;
      }
      :root[data-theme="dark"] {
        --boot-paper: #1c232a;
      }
      @media (prefers-color-scheme: dark) {
        :root[data-theme="system"] {
          --boot-paper: #1c232a;
        }
      }
      html,
      body {
        margin: 0;
        background: var(--paper, var(--boot-paper));
      }
    </style>
    <script>
      (() => {
        let theme = "system";
        try {
          const saved = localStorage.getItem("blocks-appearance");
          if (["light", "dark", "system"].includes(saved)) theme = saved;
        } catch {}
        document.documentElement.dataset.theme = theme;
        const dark =
          theme === "dark" ||
          (theme === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.querySelector('meta[name="theme-color"]').content = dark
          ? "#1c232a"
          : "#f6f5f1";
        document
          .querySelector('meta[name="apple-mobile-web-app-status-bar-style"]')
          ?.setAttribute("content", "black-translucent");
      })();
    </script>
    <meta
      name="description"
      content="A colorful block puzzle. Clear lines, build combos, earn undo, and play offline. No ads."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Blocks" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Blocks</title>
  </head>
  <body>
    <div id="root"></div>
    <noscript>This puzzle game needs JavaScript enabled.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
